name: Triagem semanal de lançamentos EV/PHEV/HEV

on:
  schedule:
    # 09:00 UTC toda segunda-feira = 06:00 no horário de Brasília
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # permite rodar manualmente também, pelo botão no GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar varredura dos canais do YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/scan-channels.mjs

      - name: Rodar varredura dos sites oficiais das marcas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/scan-brand-sites.mjs

      - name: Checar se apareceu candidato de lançamento
        id: check
        run: |
          has_video="false"
          has_brand="false"
          if [ -f scripts/pending-reviews/.last-run-had-candidates ] && [ "$(cat scripts/pending-reviews/.last-run-had-candidates)" = "true" ]; then
            has_video="true"
          fi
          if [ -f scripts/pending-reviews/.last-run-had-brand-candidates ] && [ "$(cat scripts/pending-reviews/.last-run-had-brand-candidates)" = "true" ]; then
            has_brand="true"
          fi
          if [ "$has_video" = "true" ] || [ "$has_brand" = "true" ]; then
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir Pull Request com o relatório (se houver candidatos)
        if: steps.check.outputs.has_candidates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Triagem semanal de lançamentos EV/PHEV/HEV"
          title: "🔎 Triagem semanal de lançamentos EV/PHEV/HEV"
          body: |
            Relatório automático gerado pela varredura dos canais do YouTube e/ou dos
            sites oficiais das marcas. Sinal de site oficial já foi registrado como
            "pending" em `car_review_queue` no Supabase — revise lá antes de aprovar.
            Sinal de vídeo é só indicação; se for de fato um lançamento novo, pesquise
            e cadastre o carro direto no Supabase (veja README).
          branch: "triagem-semanal/${{ github.run_id }}"
          add-paths: scripts/pending-reviews/**
