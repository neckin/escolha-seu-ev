name: Especial de Instagram (Reels + carrossel + Stories)

# Todo domingo às 18h (Brasília) gera o especial da semana (tema em rodízio,
# scripts/instagram-kit/especial.mjs), sobe para o Storage e publica o Reels e o carrossel (cada um com o
# seu Story) no Instagram e na Página do Facebook. Rodar de novo não duplica:
# o publish.mjs pula o que já foi publicado. Pelo botão, publicar é opcional.
# Pausa junto com os outros: variável INSTAGRAM_AUTOPUBLISH = off.

on:
  schedule:
    - cron: "0 21 * * 0" # 21:00 UTC = 18:00 em Brasília, domingo
  workflow_dispatch:
    inputs:
      date:
        description: "Data do especial (AAAA-MM-DD). Vazio = hoje"
        type: string
        default: ""
      theme:
        description: "Tema (vazio = rodízio): sofa, madrugada, renovacao, confianca"
        type: string
        default: ""
      publish:
        description: "Publicar agora (desmarcado = só gera e sobe para conferir)"
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  especial:
    if: github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_AUTOPUBLISH != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUSEP_REGISTRO: ${{ secrets.SUSEP_REGISTRO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Gerar o especial e subir para o Storage
        id: build
        env:
          DATE: ${{ inputs.date }}
          THEME: ${{ inputs.theme }}
        run: |
          if [ -z "$DATE" ]; then DATE=$(TZ=America/Sao_Paulo date +%F); fi
          echo "kit=especial-$DATE" >> "$GITHUB_OUTPUT"
          ARGS=""
          if [ -n "$THEME" ]; then ARGS="--theme $THEME"; fi
          node scripts/instagram-kit/especial.mjs --date "$DATE" $ARGS --out instagram-kit-out --upload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-especial
          path: instagram-kit-out
          retention-days: 30

      - name: Publicar Reels + Story
        if: github.event_name == 'schedule' || inputs.publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
        run: node scripts/instagram-kit/publish.mjs --kit ${{ steps.build.outputs.kit }} --day sun

      - name: Publicar carrossel + Story
        if: github.event_name == 'schedule' || inputs.publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
        run: node scripts/instagram-kit/publish.mjs --kit ${{ steps.build.outputs.kit }} --day sun2
