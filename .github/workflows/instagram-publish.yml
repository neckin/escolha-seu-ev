name: Publicar Instagram e Facebook (seg/qua/sex)

on:
  schedule:
    # 21:00 UTC = 18:00 em Brasília, segunda, quarta e sexta. O kit da semana
    # é gerado na segunda às 07:00 (instagram-kit.yml).
    - cron: "0 21 * * 1,3,5"
  workflow_dispatch:
    inputs:
      day:
        description: "Qual post publicar (auto = o de hoje)"
        type: choice
        options: [auto, mon, wed, fri]
        default: auto
      check:
        description: "Só verificar o token e as contas (não publica nada)"
        type: boolean
        default: false
      force:
        description: "Publicar de novo mesmo se já publicado (cuidado: duplica o post)"
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    # Interruptor: variável INSTAGRAM_AUTOPUBLISH = off pausa os agendados
    # (rodar pelo botão continua funcionando).
    if: github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_AUTOPUBLISH != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Só é usado se a semana ainda não tiver kit no Storage (gera na hora).
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Publicar o post do dia
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUSEP_REGISTRO: ${{ secrets.SUSEP_REGISTRO }}
          DAY: ${{ inputs.day }}
          FORCE: ${{ inputs.force }}
          CHECK: ${{ inputs.check }}
        run: |
          if [ "$CHECK" = "true" ]; then node scripts/instagram-kit/publish.mjs --check; exit $?; fi
          ARGS=""
          if [ -n "$DAY" ] && [ "$DAY" != "auto" ]; then ARGS="--day $DAY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/instagram-kit/publish.mjs $ARGS
