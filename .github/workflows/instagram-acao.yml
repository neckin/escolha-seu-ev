name: Ação de Instagram (listas de carros para turbinar)

# Ações pontuais (scripts/instagram-kit/acao.mjs): Reels + carrossel + 2
# Stories, no Instagram e na Página, no kit acao-<data>/ do Storage.
#   lista ate150: 5 elétricos até R$ 150 mil;
#   lista top10:  5 elétricos + 5 híbridos até R$ 200 mil (parte 2).
# Abre com cenas reais da Pixabay, ou com scripts/instagram-kit/assets/
# acao-intro.* (vídeo próprio), se existir.
#
# Agenda (cada linha vale uma vez só; o passo confere a data):
#   17/11 12h: carrossel da lista ate150 (kit acao-2026-11-16)
#   19/11 12h: Reels da lista top10 (kit acao-2026-11-19)
#   19/11 19h: carrossel da lista top10
# Pelo botão: escolha a data do kit, a lista e o que publicar.
# Rodar de novo não duplica (o publish.mjs pula o que já foi publicado).

on:
  schedule:
    - cron: "0 15 17 11 *" # 12:00 em Brasília
    - cron: "0 15 19 11 *" # 12:00 em Brasília
    - cron: "0 22 19 11 *" # 19:00 em Brasília
  workflow_dispatch:
    inputs:
      date:
        description: "Data do kit (AAAA-MM-DD)"
        type: string
        default: "2026-11-19"
      lista:
        description: "Lista"
        type: choice
        options: [top10, ate150]
        default: top10
      post:
        description: "O que publicar agora"
        type: choice
        options: [nada, reels, carrossel, os-dois]
        default: nada

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  acao:
    if: github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_AUTOPUBLISH != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUSEP_REGISTRO: ${{ secrets.SUSEP_REGISTRO }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Decidir o que gerar e publicar
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_DATE: ${{ inputs.date }}
          IN_LISTA: ${{ inputs.lista }}
          IN_POST: ${{ inputs.post }}
        run: |
          TODAY=$(TZ=America/Sao_Paulo date +%F)
          REELS=false; CAROUSEL=false; KIT_DATE=""; LISTA=""; DUE=""
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "0 15 17 11 *") DUE=2026-11-17; KIT_DATE=2026-11-16; LISTA=ate150; CAROUSEL=true;;
              "0 15 19 11 *") DUE=2026-11-19; KIT_DATE=2026-11-19; LISTA=top10; REELS=true;;
              "0 22 19 11 *") DUE=2026-11-19; KIT_DATE=2026-11-19; LISTA=top10; CAROUSEL=true;;
            esac
            if [ "$TODAY" != "$DUE" ]; then REELS=false; CAROUSEL=false; fi
          else
            KIT_DATE="$IN_DATE"; LISTA="$IN_LISTA"
            case "$IN_POST" in reels) REELS=true;; carrossel) CAROUSEL=true;; os-dois) REELS=true; CAROUSEL=true;; esac
          fi
          # Agendado só gera se o kit ainda não estiver no Storage.
          BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            if [ "$REELS$CAROUSEL" = "falsefalse" ]; then BUILD=false
            elif curl -sfo /dev/null "$SUPABASE_URL/storage/v1/object/public/instagram-kit/acao-$KIT_DATE/manifest.json"; then BUILD=false; fi
          fi
          {
            echo "kit=acao-$KIT_DATE"; echo "date=$KIT_DATE"; echo "lista=$LISTA"
            echo "build=$BUILD"; echo "reels=$REELS"; echo "carousel=$CAROUSEL"
          } >> "$GITHUB_OUTPUT"
          echo "Hoje $TODAY · kit acao-$KIT_DATE ($LISTA) · gerar=$BUILD · reels=$REELS · carrossel=$CAROUSEL"

      - name: Instalar ffmpeg
        if: steps.plan.outputs.build == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Gerar a ação e subir para o Storage
        if: steps.plan.outputs.build == 'true'
        env:
          KIT_DATE: ${{ steps.plan.outputs.date }}
          LISTA: ${{ steps.plan.outputs.lista }}
        run: |
          INTRO=""
          for f in scripts/instagram-kit/assets/acao-intro.*; do [ -f "$f" ] && INTRO="--intro $f"; done
          node scripts/instagram-kit/acao.mjs --lista "$LISTA" --date "$KIT_DATE" $INTRO --out instagram-kit-out --upload

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.build == 'true'
        with:
          name: instagram-acao
          path: instagram-kit-out
          retention-days: 30

      - name: Publicar Reels + Story
        if: steps.plan.outputs.reels == 'true'
        run: node scripts/instagram-kit/publish.mjs --kit "${{ steps.plan.outputs.kit }}" --day rank

      - name: Publicar carrossel + Story
        if: steps.plan.outputs.carousel == 'true'
        run: node scripts/instagram-kit/publish.mjs --kit "${{ steps.plan.outputs.kit }}" --day rank2
