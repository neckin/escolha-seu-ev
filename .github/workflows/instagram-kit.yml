name: Kit semanal de Instagram (seguro auto)

on:
  schedule:
    # 10:00 UTC toda segunda-feira = 07:00 em Brasília. Gera as peças da
    # semana e sobe para o Storage; o instagram-publish.yml publica às 18h.
    - cron: "0 10 * * 1"
  workflow_dispatch: {} # gera de novo pelo botão (antes de publicar a segunda)

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # O runner do GitHub já traz o Google Chrome (desenha as peças); o ffmpeg
      # (monta o Reels) não vem mais na imagem do Ubuntu 24.04.
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # Escolhe o tema pelo desempenho no Windsor.ai, gera e sobe o kit. O
      # relatório de desempenho aparece na aba "Summary" desta execução.
      - name: Gerar o kit e subir para o Storage
        env:
          SUSEP_REGISTRO: ${{ secrets.SUSEP_REGISTRO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: node scripts/instagram-kit/build.mjs --out instagram-kit-out --upload

      # Prévia das peças, baixável na página da execução por 30 dias.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-kit
          path: instagram-kit-out
          retention-days: 30
